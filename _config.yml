title: 天机枢
description: 专注 Python 自动化、脚本工具、爬虫与个人效率方案的独立创作者品牌
author: 天机枢
url: https://222bcnn.github.io
baseurl: /geo-content
lang: zh-CN

# 启用 Jekyll 默认主题
theme: jekyll-theme-cayman

# 关键: 不转义 markdown 里的 HTML(JSON-LD 是 <script> 标签)
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# 让 .md 文件按 default layout 渲染
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# 站点地图 + RSS 给 AI 爬虫
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
